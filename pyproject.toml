[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "positively"
dynamic = ["version"]
description = "Automated positive-framing enforcement — scan and rewrite negative compliance/escalation language in prose, comments, and docstrings."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
positively = "positively.cli:main"

[project.optional-dependencies]
dev = ["ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/yashodhank/positively"
Repository = "https://github.com/yashodhank/positively"

[tool.setuptools.dynamic]
version = { attr = "positively.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
files = ["src/positively"]