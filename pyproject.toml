[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "positively"
version = "0.1.0"
description = "Automated positive-framing enforcement — scan and rewrite negative compliance/escalation language in prose, comments, and docstrings."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = []

[project.scripts]
positively = "positively.cli:main"

[project.optional-dependencies]
dev = ["ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/yashodhank/positively"
Repository = "https://github.com/yashodhank/positively"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
files = ["src/positively"]