[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "positively"
version = "0.1.0"
description = "Automated positive-framing enforcement — scan and rewrite negative compliance/escalation language in prose, comments, and docstrings."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = []

[project.scripts]
positively = "positively.cli:main"

[project.optional-dependencies]
dev = []

[project.urls]
Homepage = "https://github.com/yashodhank/positively"
Repository = "https://github.com/yashodhank/positively"

[tool.setuptools.packages.find]
where = ["src"]